<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1020" />
      <stop offset="100%" stop-color="#14090B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C9C4" />
      <stop offset="100%" stop-color="#F4E9DC" />
    </linearGradient>
  </defs>
  
  <!-- Outer anime octagonal shield -->
  <polygon points="16,4 48,4 60,16 60,48 48,60 16,60 4,48 4,16" fill="url(#bgGrad)" stroke="#E8C9C4" stroke-width="2.5" />
  
  <!-- Inner decorative slash -->
  <line x1="8" y1="20" x2="20" y2="8" stroke="#7A1020" stroke-width="2" />
  <line x1="44" y1="56" x2="56" y2="44" stroke="#7A1020" stroke-width="2" />
  
  <!-- Stylized Terminal Anime Compile Symbol "C / >_" -->
  <path d="M 22 20 L 32 32 L 22 44" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="36" y1="42" x2="46" y2="42" stroke="#F4E9DC" stroke-width="4.5" stroke-linecap="round" />

  <!-- Anime focus stamp dot -->
  <circle cx="48" cy="16" r="3" fill="#C9D3C2" />
</svg>
